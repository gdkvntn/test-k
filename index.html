<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src http: https: ws: wss://*:*/ wss://*/*;"
    />
  </head>
  <body>
    <script>
      // Полностью очищаем документ
      document.documentElement.innerHTML = '';

      // Ждем 3 секунды
      setTimeout(() => {
        // Создаем новый HTML документ
        const newDoc = document.implementation.createHTMLDocument();
        newDoc.documentElement.innerHTML = `
                <!doctype html>
                <html lang="en" style="height: 100%; overflow: hidden">
                  <head>
                    <meta charset="UTF-8" />
                    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
                    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                 <meta http-equiv="Content-Security-Policy" content="connect-src http: https: ws: wss://*:*/ wss://*/*;">
                    <title>Vite + React + TS</title>
                    <script>
                      var kameleoonLoadingTimeout = 1000;
                      window.kameleoonQueue = window.kameleoonQueue || [];
                      window.kameleoonStartLoadTime = new Date().getTime();
                      if (!document.getElementById('kameleoonLoadingStyleSheet') && !window.kameleoonDisplayPageTimeOut) {
                        var kameleoonS = document.getElementsByTagName('script')[0];
                        var kameleoonCc = '* { visibility: hidden !important; background-image: none !important; }';
                        var kameleoonStn = document.createElement('style');
                        kameleoonStn.type = 'text/css';
                        kameleoonStn.id = 'kameleoonLoadingStyleSheet';
                        if (kameleoonStn.styleSheet) {
                          kameleoonStn.styleSheet.cssText = kameleoonCc;
                        } else {
                          kameleoonStn.appendChild(document.createTextNode(kameleoonCc));
                        }
                        kameleoonS.parentNode.insertBefore(kameleoonStn, kameleoonS);
                        window.kameleoonDisplayPage = function (fromEngine) {
                          if (!fromEngine) {
                            window.kameleoonTimeout = true;
                          }
                          if (kameleoonStn.parentNode) {
                            kameleoonStn.parentNode.removeChild(kameleoonStn);
                          }
                        };
                        window.kameleoonDisplayPageTimeOut = window.setTimeout(window.kameleoonDisplayPage, kameleoonLoadingTimeout);
                      }
                    <\/script>
                    <script type="text/javascript" src="//zq52tvcwyx.kameleoon.io/engine.js" fetchpriority="high" async><\/script>
                  </head>
                  <body style="height: 100%">
                    <div id="root" style="height: 100%; overflow-y: auto"></div>
                    <script type="module" src="/src/main.tsx"><\/script>
                  </body>
                </html>
            `;

        // Заменяем текущий документ
        document.replaceChild(
          newDoc.documentElement,
          document.documentElement,
        );
      }, 3000);
    </script>
  </body>
</html>
